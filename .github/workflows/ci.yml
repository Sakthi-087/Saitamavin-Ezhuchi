name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      ENABLE_SAMPLE_DATA_FALLBACK: "false"
      AI_CATEGORIZATION_ENABLED: "false"
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role
      OPENROUTER_API_KEY: ""
    defaults:
      run:
        working-directory: carebank-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run backend tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report
      - name: Backend lint (optional)
        continue-on-error: true
        run: |
          python -m pip install ruff black
          ruff check app tests
          black --check app tests

  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://localhost:8000
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
    defaults:
      run:
        working-directory: carebank-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: carebank-frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run frontend tests
        run: npm run test:run
      - name: npm audit (high, non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high

  migration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carebank-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run migration validation tests
        run: python -m unittest tests.test_persistence_audit.TestPersistenceMigration -v

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carebank-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: pip-audit (non-blocking)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit
